name: Confirm Working Setup
description: Let the community know this script worked on your hardware
title: "[Hardware Confirmation]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for confirming!
        This helps other Linux users know which hardware combinations are stable.
  - type: input
    id: host_device
    attributes:
      label: Host Device & CPU
      description: What is your laptop/mini-PC model and processor?
      placeholder: "e.g., Minisforum UM780 XTX (AMD Ryzen 7 7840HS)"
    validations:
      required: true
  - type: dropdown
    id: pcie_speed
    attributes:
      label: Negotiated Link Speed
      options:
        - "PCIe Gen4 x4 (16 GT/s)"
        - "PCIe Gen3 x4 (8 GT/s)"
        - "PCIe Gen5 x4 (32 GT/s)"
        - "Other"
    validations:
      required: true
  - type: input
    id: distro_kernel
    attributes:
      label: Linux Distro & Kernel
      description: Which OS and kernel version are you running?
      placeholder: "e.g., CachyOS / Kernel 6.10.x"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any extra tweaks or Thunderbolt dock quirks? (Optional)
